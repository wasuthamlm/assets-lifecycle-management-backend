<!doctype html>
<!--
  รูปโปรไฟล์ LINE OA (640×640, LINE ครอปเป็นวงกลม — เนื้อหาสำคัญอยู่ในวงกลางเท่านั้น)
  สร้าง PNG: msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=640,640 --screenshot=assets\line\oa-profile.png assets\line\oa-profile.html
-->
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 640px; height: 640px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', 'Leelawadee UI', sans-serif;
    background: radial-gradient(circle at 30% 25%, #6366F1 0%, #4338CA 45%, #0E7490 100%);
    display: grid; place-items: center; position: relative;
  }
  /* ลายวงจรจางๆ */
  .grid { position: absolute; inset: 0; opacity: .14;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(circle, #000 30%, transparent 72%); }
  .ring { position: absolute; width: 470px; height: 470px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); }
  .content { position: relative; display: flex; flex-direction: column; align-items: center; }
  svg { width: 250px; height: 250px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.25)); }
  .label { margin-top: 6px; color: #fff; font-size: 88px; font-weight: 800; letter-spacing: 10px; line-height: 1; }
  .sub { margin-top: 10px; color: rgba(255,255,255,.8); font-size: 26px; font-weight: 600; letter-spacing: 8px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="ring"></div>
  <div class="content">
    <!-- จอคอม + เฟือง + เส้นวงจร -->
    <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="48" height="32" rx="4" stroke-width="3"/>
      <path d="M24 52h16M32 42v10" stroke-width="3"/>
      <circle cx="32" cy="26" r="6" stroke-width="2.6"/>
      <path d="M32 16v3M32 33v3M22 26h3M39 26h3M25 19l2 2M37 31l2 2M39 19l-2 2M27 31l-2 2" stroke-width="2.6"/>
      <circle cx="14" cy="16" r="1.4" fill="#5EEAD4" stroke="none"/>
      <circle cx="50" cy="36" r="1.4" fill="#5EEAD4" stroke="none"/>
    </svg>
    <div class="label">IT</div>
    <div class="sub">SERVICE DESK</div>
  </div>
</body>
</html>
