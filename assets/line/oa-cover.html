<!doctype html>
<!--
  รูปปก (cover) หน้าโปรไฟล์ LINE OA (1080×878) — รูปโปรไฟล์วงกลมจะทับกลางขอบล่าง จึงเว้นพื้นที่ล่างไว้
  สร้าง PNG: msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1080,878 --screenshot=assets\line\oa-cover.png assets\line\oa-cover.html
-->
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 878px; overflow: hidden; }
  body {
    font-family: 'Leelawadee UI', 'Segoe UI', sans-serif; color: #fff; position: relative;
    background: linear-gradient(135deg, #0B1220 0%, #1E1B4B 55%, #0E3A4A 100%);
  }
  .grid { position: absolute; inset: 0; opacity: .10;
    background-image: linear-gradient(#94A3B8 1px, transparent 1px), linear-gradient(90deg, #94A3B8 1px, transparent 1px);
    background-size: 54px 54px; }
  .glow1 { position: absolute; width: 620px; height: 620px; border-radius: 50%; left: -180px; top: -220px;
    background: radial-gradient(circle, rgba(99,102,241,.55), transparent 65%); }
  .glow2 { position: absolute; width: 640px; height: 640px; border-radius: 50%; right: -200px; bottom: -160px;
    background: radial-gradient(circle, rgba(20,184,166,.45), transparent 65%); }
  /* เส้นวงจร */
  svg.circuit { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }
  .main { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
  .eyebrow { display: inline-block; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: #A5B4FC;
    padding: 10px 26px; border: 2px solid rgba(165,180,252,.4); border-radius: 999px; }
  h1 { font-family: 'Segoe UI', sans-serif; font-size: 104px; font-weight: 800; letter-spacing: 2px; margin-top: 34px; line-height: 1.05; }
  h1 span { background: linear-gradient(90deg, #818CF8, #5EEAD4); -webkit-background-clip: text; color: transparent; }
  .th { font-size: 40px; font-weight: 600; margin-top: 18px; color: #E2E8F0; }
  .chips { margin-top: 44px; display: flex; justify-content: center; gap: 18px; }
  .chip { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; padding: 16px 28px;
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); border-radius: 22px; }
  .chip svg { width: 34px; height: 34px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <svg class="circuit" viewBox="0 0 1080 878" fill="none" stroke="#5EEAD4" stroke-width="2">
    <path d="M0 120h140l40 40h120"/><circle cx="300" cy="160" r="6" fill="#5EEAD4"/>
    <path d="M1080 90H930l-40 40H800"/><circle cx="800" cy="130" r="6" fill="#5EEAD4"/>
    <path d="M0 700h90l50-50h80"/><circle cx="220" cy="650" r="6" fill="#818CF8" stroke="#818CF8"/>
    <path d="M1080 720H980l-50-50h-70"/><circle cx="860" cy="670" r="6" fill="#818CF8" stroke="#818CF8"/>
  </svg>
  <div class="main">
    <div class="eyebrow">ฝ่ายเทคโนโลยีสารสนเทศ</div>
    <h1>IT <span>Service Desk</span></h1>
    <div class="th">แจ้งปัญหาและเบิกอุปกรณ์ ง่ายๆ ผ่าน LINE</div>
    <div class="chips">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>แจ้งปัญหา IT</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>เบิก/ยืมอุปกรณ์</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg>ติดตามสถานะ</div>
    </div>
  </div>
</body>
</html>
